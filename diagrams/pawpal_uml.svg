<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1500 1120" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">PawPal UML class diagram</title>
  <desc id="desc">Class relationships and key members for Owner, Pet, CareTask, DailyScheduler, and TaskAssignment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#526078"/>
    </marker>
    <marker id="dashed-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7b61a8"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #253047; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #68748a; }
      .class-name { font-size: 21px; font-weight: 700; }
      .stereotype { font-size: 13px; font-weight: 700; letter-spacing: 1px; fill: #6e56a0; }
      .member { font-size: 15px; }
      .divider { stroke: #d7ddec; stroke-width: 1.5; }
      .card { fill: #fff; stroke: #8b78bf; stroke-width: 2; }
      .card-head { fill: #f0edfa; }
      .relation { fill: none; stroke: #526078; stroke-width: 2.2; marker-end: url(#arrow); }
      .dependency { fill: none; stroke: #7b61a8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#dashed-arrow); }
      .label { font-size: 14px; font-weight: 600; fill: #526078; }
      .mult { font-size: 13px; fill: #68748a; }
    </style>
  </defs>

  <rect width="1500" height="1120" rx="24" fill="#f8f9fd"/>
  <text class="title" x="70" y="52">PawPal system</text>
  <text class="subtitle" x="70" y="78">UML class diagram — reflects the final pawpal_system.py implementation</text>

  <!-- Owner -->
  <g>
    <rect class="card" x="70" y="110" width="570" height="230" rx="12"/>
    <path class="card-head" d="M82 110H628a12 12 0 0 1 12 12v49H70v-49a12 12 0 0 1 12-12Z"/>
    <text class="class-name" x="355" y="150" text-anchor="middle">Owner</text>
    <line class="divider" x1="70" y1="171" x2="640" y2="171"/>
    <text class="member" x="94" y="201">+ name: str</text>
    <text class="member" x="94" y="225">+ pets: list[Pet]</text>
    <line class="divider" x1="70" y1="241" x2="640" y2="241"/>
    <text class="member" x="94" y="269">+ update_details(name)</text>
    <text class="member" x="94" y="293">+ add_pet(pet) · list_pets()</text>
    <text class="member" x="94" y="317">+ get_all_tasks() · remove_pet(pet)</text>
  </g>

  <!-- Pet -->
  <g>
    <rect class="card" x="70" y="410" width="570" height="270" rx="12"/>
    <path class="card-head" d="M82 410H628a12 12 0 0 1 12 12v49H70v-49a12 12 0 0 1 12-12Z"/>
    <text class="class-name" x="355" y="450" text-anchor="middle">Pet</text>
    <line class="divider" x1="70" y1="471" x2="640" y2="471"/>
    <text class="member" x="94" y="501">+ name: str · species: str</text>
    <text class="member" x="94" y="525">+ tasks: list[CareTask]</text>
    <line class="divider" x1="70" y1="541" x2="640" y2="541"/>
    <text class="member" x="94" y="569">+ update_details(name, species)</text>
    <text class="member" x="94" y="593">+ add_task(task) · list_tasks()</text>
    <text class="member" x="94" y="617">+ remove_task(task) · complete_task(task)</text>
  </g>

  <!-- CareTask -->
  <g>
    <rect class="card" x="70" y="750" width="570" height="320" rx="12"/>
    <path class="card-head" d="M82 750H628a12 12 0 0 1 12 12v49H70v-49a12 12 0 0 1 12-12Z"/>
    <text class="class-name" x="355" y="790" text-anchor="middle">CareTask</text>
    <line class="divider" x1="70" y1="811" x2="640" y2="811"/>
    <text class="member" x="94" y="841">+ description: str · title: str</text>
    <text class="member" x="94" y="865">+ due_date: datetime · is_completed: bool</text>
    <text class="member" x="94" y="889">+ duration_minutes: int · priority: str</text>
    <text class="member" x="94" y="913">+ frequency: str</text>
    <text class="member" x="94" y="937">- _pet: Optional[Pet]</text>
    <line class="divider" x1="70" y1="953" x2="640" y2="953"/>
    <text class="member" x="94" y="981">+ is_due_on(selected_date) · mark_complete()</text>
  </g>

  <!-- DailyScheduler -->
  <g>
    <rect class="card" x="800" y="160" width="630" height="500" rx="12"/>
    <path class="card-head" d="M812 160H1418a12 12 0 0 1 12 12v49H800v-49a12 12 0 0 1 12-12Z"/>
    <text class="class-name" x="1115" y="200" text-anchor="middle">DailyScheduler</text>
    <line class="divider" x1="800" y1="221" x2="1430" y2="221"/>
    <text class="member" x="826" y="254">+ get_tasks(owner)</text>
    <text class="member" x="826" y="286">+ sort_tasks_by_due_date(tasks)</text>
    <text class="member" x="826" y="318">+ sort_by_time(tasks)</text>
    <text class="member" x="826" y="350">+ filter_tasks_by_completion_status(tasks, is_completed)</text>
    <text class="member" x="826" y="382">+ filter_tasks_by_due_status(tasks, selected_date, status)</text>
    <text class="member" x="826" y="414">+ build_daily_schedule(tasks, selected_date, available_minutes)</text>
    <text class="member" x="826" y="446">+ find_time_conflicts(tasks, selected_date)</text>
    <line class="divider" x1="800" y1="474" x2="1430" y2="474"/>
    <text class="subtitle" x="826" y="509">Works with pet-task assignments to filter, prioritize,</text>
    <text class="subtitle" x="826" y="535">schedule, and detect overlapping task times.</text>
  </g>

  <!-- TaskAssignment -->
  <g>
    <rect class="card" x="900" y="750" width="430" height="130" rx="12"/>
    <path class="card-head" d="M912 750H1318a12 12 0 0 1 12 12v40H900v-40a12 12 0 0 1 12-12Z"/>
    <text class="stereotype" x="1115" y="774" text-anchor="middle">TYPE ALIAS</text>
    <text class="class-name" x="1115" y="827" text-anchor="middle">TaskAssignment</text>
    <text class="member" x="1115" y="856" text-anchor="middle">tuple[Pet, CareTask]</text>
  </g>

  <!-- Relationships -->
  <path class="relation" d="M355 340V410"/>
  <text class="mult" x="365" y="360">0..*</text>
  <text class="mult" x="365" y="402">1..*</text>
  <text class="label" x="384" y="381">contains</text>

  <path class="relation" d="M355 750V680"/>
  <text class="mult" x="365" y="700">0..1</text>
  <text class="mult" x="365" y="742">0..*</text>
  <text class="label" x="384" y="721">attached to</text>

  <path class="dependency" d="M1115 660V750"/>
  <text class="label" x="1132" y="710">uses</text>

  <path class="dependency" d="M800 265H710V130H640"/>
  <rect x="649" y="180" width="122" height="40" rx="6" fill="#f8f9fd"/>
  <text class="label" x="710" y="196" text-anchor="middle">gets tasks</text>
  <text class="label" x="710" y="213" text-anchor="middle">from owner</text>
</svg>
